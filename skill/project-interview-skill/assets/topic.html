<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TOPIC_TITLE}}</title>
  <style>
    :root { color-scheme: light; --ink: #202c32; --muted: #64716f; --accent: #17675b; --line: #dce5df; --paper: #fafbf8; --surface: #fff; --tint: #edf5f1; --wait: #906016; --error: #ac4039; }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 1.5rem; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 1rem/1.8 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    main { max-width: 70rem; margin: auto; padding: 1.4rem clamp(1rem, 4vw, 3rem) 3.5rem; }
    a { color: var(--accent); text-underline-offset: .2em; overflow-wrap: anywhere; }
    nav { display: flex; flex-wrap: wrap; gap: .5rem 1.4rem; padding-bottom: 1rem; border-bottom: 1px solid var(--line); font-size: .85rem; }
    header { max-width: 50rem; padding: 2rem 0 1.6rem; }
    .eyebrow { margin: 0 0 .6rem; color: var(--muted); font-size: .78rem; letter-spacing: .08em; }
    h1 { margin: 0 0 1rem; font-size: clamp(1.9rem, 4.3vw, 2.9rem); font-weight: 650; letter-spacing: -.035em; line-height: 1.25; text-wrap: balance; }
    h2 { margin: 0 0 .6rem; font-size: 1.35rem; line-height: 1.5; }
    h3 { margin: 0 0 .4rem; font-size: 1.05rem; }
    p { margin: .6rem 0; }
    .lead { margin: 0; font-size: 1.05rem; color: #465750; }
    .scene-note { max-width: 48rem; margin-bottom: 1.2rem; color: var(--muted); }
    .lesson-stage { padding: clamp(1rem, 3vw, 2rem); border: 1px solid var(--line); background: var(--surface); border-radius: .6rem; }
    .controls { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; margin: 1rem 0; }
    button { max-width: 100%; padding: .65rem 1rem; border: 1px solid var(--accent); border-radius: .35rem; background: var(--accent); color: white; font: inherit; font-size: .92rem; line-height: 1.5; cursor: pointer; }
    button.secondary { color: var(--accent); background: white; border-color: var(--line); }
    button:hover:not(:disabled) { filter: brightness(.94); }
    button:disabled { opacity: .45; cursor: default; }
    a:focus-visible, button:focus-visible, summary:focus-visible { outline: 3px solid #b48225; outline-offset: 4px; }
    .feedback { margin-top: 1.2rem; padding: 1rem 1.2rem; border-left: 3px solid var(--accent); background: var(--tint); }
    .feedback p { margin: .2rem 0; }
    .trace { margin: 1rem 0 0; padding-left: 1.4rem; font-size: .88rem; color: var(--muted); }
    .rule { max-width: 48rem; margin: 2rem 0; }
    .rule ol { padding-left: 1.4rem; }
    .rule li + li { margin-top: .5rem; }
    .takeaway { margin-top: 1.2rem; color: var(--accent); font-weight: 600; }
    details { margin: 1rem 0; padding-top: 1rem; border-top: 1px solid var(--line); }
    summary { cursor: pointer; color: var(--accent); font-size: .92rem; }
    details > div { margin-top: 1rem; max-width: 52rem; }
    .reference-list { padding-left: 1.2rem; font-size: .88rem; color: var(--muted); }
    .reference-list li + li { margin-top: .7rem; }
    code { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: .88em; overflow-wrap: anywhere; }
    pre { max-width: 100%; overflow-wrap: anywhere; white-space: pre-wrap; padding: 1rem; background: #f3f6f2; border-left: 2px solid #bdcfc3; font-size: .9rem; line-height: 1.65; }
    .model-note, .followup { color: var(--muted); font-size: .82rem; }
    .model-note { margin-top: .8rem; }
    .followup { padding-top: 1rem; border-top: 1px solid var(--line); }
    [hidden] { display: none !important; }
    svg { max-width: 100%; }
    @media (max-width: 38rem) { header { padding-top: 1.5rem; } button { padding: .65rem .8rem; } }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { animation: none !important; transition: none !important; } }
    @media print { body { background: white; font-size: 10pt; } main { max-width: none; padding: 0; } nav, .controls, button, .followup { display: none; } header { padding-top: 0; } .lesson-stage, pre { break-inside: avoid; } details::details-content { content-visibility: visible; } details > :not(summary) { display: block; } h1, h2, h3 { break-after: avoid; } }
    {{EXTRA_STYLES}}
  </style>
</head>
<body>
  <!-- 教学设计先于填槽：一个成果、一个持续演进的实例、每步一个主要事件、操作后立即解释原因。
       DEMO_HTML 按机制画集合/时间线/泳道/依赖图，不套固定三栏或预置答案切换；DEMO_SCRIPT 驱动真实状态。
       完整课文留在 Markdown。主图与短规则应足以解释核心因果，参考资料后置。每页自行定义可实测操作及预期。
       文本/属性须转义；*_HTML 和脚本由作者编写。单文件离线交付，不引入 CDN。 -->
  <main data-lesson="{{LESSON_KIND}}">
    <nav aria-label="课程导航">
      <a href="{{GUIDE_HREF}}">← 返回导学</a>
      <a href="{{COURSE_HREF}}">完整课程 · {{COURSE_LABEL}}</a>
    </nav>
    <header>
      <p class="eyebrow">{{COURSE_LABEL}} · 一次弄懂一个机制</p>
      <h1>{{TOPIC_TITLE}}</h1>
      <p class="lead">{{LEARNING_OUTCOME}}</p>
    </header>
    <section id="explore" aria-labelledby="demo-title">
      <h2 id="demo-title">{{DEMO_TITLE}}</h2>
      <p class="scene-note">{{SCENE}}</p>
      <div class="lesson-stage">{{DEMO_HTML}}</div>
      <p class="model-note">{{MODEL_NOTE}}</p>
    </section>
    <section id="mechanism" class="rule">
      <h2>{{RULE_TITLE}}</h2>
      {{RULE_HTML}}
      <p class="takeaway">{{TAKEAWAY}}</p>
    </section>
    <details id="evidence">
      <summary>按需查阅：源码、术语和适用边界</summary>
      <div>
        <p>{{SOURCE_BASELINE}}</p>
        {{REFERENCE_HTML}}
      </div>
    </details>
    <p class="followup">哪一步还没想通，可以把当时的场景和操作告诉我，我们沿着这一步继续看。</p>
  </main>
  <script>
    {{DEMO_SCRIPT}}
    (() => {
      let lessonClosedDetails = [];
      window.addEventListener('beforeprint', () => {
        lessonClosedDetails = [...document.querySelectorAll('details:not([open])')];
        lessonClosedDetails.forEach(node => { node.open = true; });
      });
      window.addEventListener('afterprint', () => {
        lessonClosedDetails.forEach(node => { node.open = false; });
        lessonClosedDetails = [];
      });
    })();
  </script>
</body>
</html>
